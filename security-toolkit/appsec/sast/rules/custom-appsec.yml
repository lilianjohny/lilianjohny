# Custom Semgrep rules for common application-security sinks.
# Intentionally high-signal; tune per codebase. Run via appsec/sast/semgrep_scan.sh.
rules:
  - id: python-eval-exec-user-input
    languages: [python]
    severity: ERROR
    message: >
      Use of eval()/exec() can lead to code injection. Avoid dynamic evaluation
      of untrusted input; use safe parsers (ast.literal_eval, json).
    metadata:
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >
      subprocess call with shell=True risks command injection when arguments
      include untrusted data. Pass an argv list and shell=False.
    metadata:
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: os.system(...)

  - id: python-yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: "yaml.load without SafeLoader can execute arbitrary objects. Use yaml.safe_load."
    metadata:
      owasp: "A08:2021 - Software and Data Integrity Failures"
    patterns:
      - pattern: yaml.load($X)

  - id: python-requests-verify-false
    languages: [python]
    severity: WARNING
    message: "TLS verification disabled (verify=False) exposes traffic to MITM."
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
    patterns:
      - pattern: requests.$M(..., verify=False, ...)

  - id: weak-hash-md5-sha1
    languages: [python]
    severity: WARNING
    message: "MD5/SHA1 are weak for security use. Use SHA-256+ or a password KDF (bcrypt/argon2)."
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)

  - id: js-dangerous-innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: "Assigning to innerHTML with untrusted data enables DOM XSS. Prefer textContent or sanitize."
    metadata:
      owasp: "A03:2021 - Injection (XSS)"
    patterns:
      - pattern: $EL.innerHTML = $X

  - id: hardcoded-jwt-secret
    languages: [python, javascript, typescript]
    severity: ERROR
    message: "Hardcoded signing secret. Load from a secrets manager / environment, never source."
    metadata:
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-regex: (?i)(jwt|token|signing)_?secret\s*[:=]\s*["'][^"']{6,}["']
